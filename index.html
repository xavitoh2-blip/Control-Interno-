<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control Operativo - Online Shop</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; color: #333; }
        .card { background: white; padding: 20px; margin: 15px auto; width: 320px; border-radius: 12px; box-shadow: 0px 4px 12px rgba(0,0,0,0.1); }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; margin: 5px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        select, input { padding: 10px; margin: 8px 0; width: 90%; border: 1px solid #ccc; border-radius: 6px; }
        #pantallaPrincipal { display: none; }
    </style>
</head>
<body>

    <div id="pantallaLogin" class="card">
        <h3>Iniciar Turno</h3>
        <select id="selectSucursal" onchange="filtrarNombresPorSucursal()">
            <option value="">-- Selecciona Sucursal --</option>
            <option value="Mini super">Mini super</option>
            <option value="Tienda Online Shop">Tienda Online Shop</option>
            <option value="Bodega">Bodega</option>
        </select>
        <select id="nombreEmpleado"><option value="">-- Primero selecciona sucursal --</option></select>
        <button onclick="iniciarSesion()" style="background-color: #007bff; width: 90%;">Entrar</button>
    </div>

    <div id="pantallaPrincipal">
        <div class="card">
            <h3 id="saludoUsuario"></h3>
            <p id="infoSucursal"></p>
            <button onclick="cerrarSesion()" style="background-color: #dc3545;">Salir</button>
        </div>

        <div class="card">
            <h3>Registrar Asistencia</h3>
            <select id="selectTurno" onchange="cambiarOpcionesTurno()">
                <option value="">-- Selecciona Turno --</option>
                <option value="Apertura">☀️ Apertura</option>
                <option value="Cierre">🌙 Cierre</option>
            </select>
            <div id="contenedorBotones" style="display: none;">
                <button id="btnEntrada" onclick="validarYRegistrar('Entrada')">Marcar Entrada</button>
                <button id="btnSalida" onclick="validarYRegistrar('Salida')">Marcar Salida</button>
            </div>
        </div>

        <div class="card" style="text-align: left;">
            <h3>Tareas</h3>
            <label><input type="checkbox" onclick="guardarTarea('Limpieza', this)"> Limpieza y orden</label><br>
            <label><input type="checkbox" onclick="guardarTarea('Frenteo', this)"> Revisión / Frenteo</label>
        </div>
    </div>

    <script>
        const URL_API = "https://script.google.com/macros/s/AKfycbx4JRYjWcAx08jz9tK0AJQxkALnbjPCkpPz0qSwBOzftL-gdJtHrI--bGpzs9QQPcZI/exec";
        
        // --- CONFIGURA AQUÍ LAS COORDENADAS DE TU NEGOCIO ---
        const LAT_NEGOCIO = 13.6795; 
        const LON_NEGOCIO = -89.2635;
        const RADIO_METROS = 200; // Tolerancia de 200 metros

        // Al cargar la página, recuperar sesión
        window.onload = function() {
            if(localStorage.getItem("usuario")) {
                document.getElementById("saludoUsuario").innerText = localStorage.getItem("usuario");
                document.getElementById("infoSucursal").innerText = "📍 " + localStorage.getItem("sucursal");
                document.getElementById("pantallaLogin").style.display = "none";
                document.getElementById("pantallaPrincipal").style.display = "block";
                recuperarTareas();
            }
        };

        function iniciarSesion() {
            const sucursal = document.getElementById("selectSucursal").value;
            const empleado = document.getElementById("nombreEmpleado").value;
            if(!sucursal || !empleado) return alert("Completa los datos");
            
            localStorage.setItem("usuario", empleado);
            localStorage.setItem("sucursal", sucursal);
            location.reload();
        }

        function cerrarSesion() {
            localStorage.clear();
            location.reload();
        }

        function cambiarOpcionesTurno() {
            const turno = document.getElementById("selectTurno").value;
            document.getElementById("contenedorBotones").style.display = "block";
            document.getElementById("btnEntrada").style.display = (turno === "Apertura") ? "inline-block" : "none";
            document.getElementById("btnSalida").style.display = (turno === "Cierre") ? "inline-block" : "none";
        }

        function validarYRegistrar(tipo) {
            navigator.geolocation.getCurrentPosition(pos => {
                const dist = calcularDistancia(LAT_NEGOCIO, LON_NEGOCIO, pos.coords.latitude, pos.coords.longitude);
                if(dist <= RADIO_METROS) {
                    const params = new URLSearchParams({accion: "Asistencia", sucursal: localStorage.getItem("sucursal"), turno: document.getElementById("selectTurno").value, tipo: tipo, empleado: localStorage.getItem("usuario")});
                    fetch(URL_API, {method: "POST", body: params}).then(() => alert("¡Registrado con éxito!"));
                } else {
                    alert("❌ Estás muy lejos del negocio (" + Math.round(dist) + "m). Acércate para marcar.");
                }
            }, () => alert("Debes activar tu ubicación para marcar."));
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2-lat1) * Math.PI/180;
            const dLon = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function guardarTarea(nombre, chk) {
            localStorage.setItem("tarea_"+nombre, chk.checked);
            const params = new URLSearchParams({accion: "Tareas", sucursal: localStorage.getItem("sucursal"), empleado: localStorage.getItem("usuario"), tarea: nombre, estado: chk.checked});
            fetch(URL_API, {method: "POST", body: params});
        }

        function recuperarTareas() {
            document.querySelectorAll('input[type="checkbox"]').forEach(chk => {
                const nombre = chk.parentElement.innerText.trim();
                if(localStorage.getItem("tarea_"+nombre) === "true") chk.checked = true;
            });
        }
        
        function filtrarNombresPorSucursal() { /* Tu lógica existente aquí */ }
    </script>
</body>
</html>
