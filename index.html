        <!-- REGISTRAR ASISTENCIA CON TURNO -->
        <div class="card">
            <h3>Registrar Asistencia</h3>
            
            <select id="selectTurno" onchange="mostrarHorario()">
                <option value="">-- Selecciona Turno --</option>
                <option value="Apertura">☀️ Apertura</option>
                <option value="Cierre">🌙 Cierre</option>
            </select>
            
            <!-- Aquí aparecerá el horario automáticamente -->
            <p id="textoHorario" style="font-size: 13px; color: #007bff; font-weight: bold; margin: 5px 0;"></p>
            
            <button onclick="registrarAsistencia('Entrada')" style="background-color: #28a745; width: 45%;">Marcar Entrada</button>

        </div>
