<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Operativo</title>
    <style>
        body { font-family: Arial; text-align: center; background: #f4f4f9; padding: 20px; }
        .card { background: white; padding: 20px; margin: 10px auto; width: 300px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { background: #28a745; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; margin-top: 5px; }
        select { width: 100%; padding: 10px; margin: 5px 0; }
    </style>
</head>
<body>
    <div id="app" class="card">
        <h3>Registrar Asistencia</h3>
        <select id="selectTurno" onchange="cargarTareas()">
            <option value="">Selecciona Turno</option>
            <option value="apertura">Apertura</option>
            <option value="cierre">Cierre</option>
        </select>
        <button onclick="registrar('Entrada')">Marcar Entrada</button>
        <div style="margin-top:10px;">
            <label>Horas Extra:</label>
            <select id="selHE">
                <option value="0">0</option>
                <option value="1">1 hora</option>
            </select>
            <button onclick="registrar('Salida')" style="background:#dc3545;">Marcar Salida</button>
        </div>
        <hr>
        <h3>Tareas</h3>
        <div id="listaTareas" style="text-align:left;"></div>
    </div>

    <script>
        const URL = "TU_URL_DE_APPS_SCRIPT_AQUI"; // REEMPLAZA ESTO
        let tareas = [];

        fetch(URL + "?accion=verTareas").then(r => r.json()).then(d => { tareas = d; });

        function cargarTareas() {
            const turno = document.getElementById("selectTurno").value;
            const lista = document.getElementById("listaTareas");
            lista.innerHTML = "";
            tareas.forEach(fila => {
                // fila[1] es columna B (Turno), fila[4] es columna E (Tarea)
                if (String(fila[1]).toLowerCase() === turno) {
                    lista.innerHTML += `<input type="checkbox"> ${fila[4]}<br>`;
                }
            });
        }

        function registrar(tipo) {
            const params = new URLSearchParams({
                accion: "Asistencia", sucursal: "Tienda", 
                turno: document.getElementById("selectTurno").value,
                tipo: tipo, empleado: "Usuario", 
                horasExtra: document.getElementById("selHE").value
            });
            fetch(URL, {method: "POST", body: params}).then(() => alert("Registrado"));
        }
    </script>
</body>
</html>
