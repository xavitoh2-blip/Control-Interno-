<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cuadre e Inventario</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; }
        .card { background: #fff; max-width: 480px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .header-box { background: #eef2f7; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; font-size: 13px; color: #333; }
        label { font-size: 12px; font-weight: bold; color: #555; display: block; margin-top: 10px; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .grid-box { background: #f8f9fa; padding: 10px; border-radius: 6px; text-align: center; border: 1px solid #e0e0e0; }
        .btn { width: 100%; border: none; padding: 12px; font-weight: bold; font-size: 14px; border-radius: 6px; margin-top: 15px; cursor: pointer; }
        .btn-blue { background-color: #0d6efd; color: white; }
        .btn-green { background-color: #198754; color: white; }
        .btn-danger { background-color: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        .list-item { background: #f8f9fa; border: 1px solid #ddd; padding: 8px 12px; border-radius: 6px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header-box" id="infoSesion">Cargando datos de sesión...</div>

    <!-- Bloque del Producto Guiado (En Orden) -->
    <div style="background: #e9ecef; padding: 12px; border-radius: 6px; border-left: 4px solid #0d6efd;">
        <label style="margin: 0; color: #666; font-size: 11px;">Producto a contar (Orden de Lista):</label>
        <h4 id="nombreProductoGuiado" style="margin: 5px 0 0 0; color: #0d6efd; font-size: 16px;">Cargando inventario...</h4>
    </div>

    <div class="row-grid">
        <div class="grid-box">
            <label style="margin-top:0;">Stock Sistema:</label>
            <input type="number" id="invSistema" readonly style="background: #e9ecef; text-align: center; font-weight: bold;">
        </div>
        <div class="grid-box">
            <label style="margin-top:0;">Conteo Físico:</label>
            <input type="number" id="invFisico" oninput="calcularDiferenciaInventario()" style="text-align: center; font-weight: bold;" placeholder="0">
        </div>
    </div>

    <p style="font-size: 13px; font-weight: bold; margin-top: 10px;">
        Diferencia: <span id="txtDiferencia" style="color: #333;">0</span>
    </p>

    <label>Observaciones (Opcional):</label>
    <input type="text" id="invObservacion" placeholder="Ej: Empaque dañado, vencido, etc.">

    <button class="btn btn-blue" id="btnAgregar" onclick="agregarALaLista()">➕ Agregar a la Lista</button>

    <hr style="margin: 20px 0; border: 0; border-top: 1px dashed #ccc;">

    <h4 style="margin: 0; font-size: 14px;">Productos Listos para Enviar (<span id="cantPendientes">0</span>):</h4>
    <div id="contenedorListaAcumulada"></div>

    <button class="btn btn-green" id="btnEnviarTodo" onclick="enviarTodosLosCuadres()" style="display: none;">
        🚀 Registrar Todos los Cuadres
    </button>
</div>

<script>
    // REEMPLAZA ESTA URL CON LA TUYA DE APPS SCRIPT
    const URL_API = "TU_URL_DE_DESPLIEGUE_AQUI";

    let productosInventarioGlobal = [];
    let listaCuadresPendientes = [];
    let indiceProductoActual = 1; // Fila 1 (encabezado es 0)

    window.onload = function() {
        const sucursal = localStorage.getItem("sucursal") || "Sin Sucursal";
        const empleado = localStorage.getItem("usuario") || "Sin Usuario";
        document.getElementById("infoSesion").innerText = `Sucursal: ${sucursal} | Empleado: ${empleado}`;
        cargarProductosParaCuadre();
    };

    function cargarProductosParaCuadre() {
        fetch(URL_API + "?accion=verProductosInventario")
            .then(r => r.json())
            .then(data => {
                if (!Array.isArray(data) || data.length <= 1) {
                    document.getElementById("nombreProductoGuiado").innerText = "Sin productos disponibles";
                    document.getElementById("btnAgregar").disabled = true;
                    return;
                }
                productosInventarioGlobal = data;
                indiceProductoActual = 1; // Inicia en el primer producto real
                mostrarProductoActual();
            })
            .catch(err => {
                console.error("Error al cargar inventario:", err);
                document.getElementById("nombreProductoGuiado").innerText = "Error al conectar con la lista";
            });
    }

    function mostrarProductoActual() {
        if (indiceProductoActual >= productosInventarioGlobal.length) {
            document.getElementById("nombreProductoGuiado").innerText = "🎉 ¡Has completado la lista completa!";
            document.getElementById("invSistema").value = "";
            document.getElementById("invFisico").value = "";
            document.getElementById("invFisico").disabled = true;
            document.getElementById("btnAgregar").disabled = true;
            document.getElementById("txtDiferencia").innerText = "0";
            return;
        }

        const prodNombre = productosInventarioGlobal[indiceProductoActual][0];
        const prodSistema = productosInventarioGlobal[indiceProductoActual][1] || 0;

        document.getElementById("nombreProductoGuiado").innerText = `${indiceProductoActual}. ${prodNombre}`;
        document.getElementById("invSistema").value = prodSistema;
        document.getElementById("invFisico").value = "";
        document.getElementById("invFisico").disabled = false;
        document.getElementById("btnAgregar").disabled = false;
        document.getElementById("invFisico").focus();
        calcularDiferenciaInventario();
    }

    function calcularDiferenciaInventario() {
        const sis = parseFloat(document.getElementById("invSistema").value) || 0;
        const fisVal = document.getElementById("invFisico").value;
        const fis = parseFloat(fisVal) || 0;
        const dif = fis - sis;
        
        const txt = document.getElementById("txtDiferencia");
        if (fisVal === "") {
            txt.innerText = "0";
            txt.style.color = "#333";
        } else {
            txt.innerText = (dif > 0 ? "+" : "") + dif;
            txt.style.color = dif === 0 ? "green" : (dif < 0 ? "red" : "blue");
        }
    }

    function agregarALaLista() {
        const fisico = document.getElementById("invFisico").value;
        const sistema = document.getElementById("invSistema").value;
        const observacion = document.getElementById("invObservacion").value.trim();

        if (fisico === "") {
            alert("Por favor ingresa el conteo físico antes de continuar.");
            return;
        }

        const nombreProducto = productosInventarioGlobal[indiceProductoActual][0];
        const dif = parseFloat(fisico) - parseFloat(sistema);

        listaCuadresPendientes.push({
            producto: nombreProducto,
            sistema: sistema,
            fisico: fisico,
            diferencia: dif,
            observacion: observacion
        });

        document.getElementById("invObservacion").value = "";

        // Avanzar al siguiente producto de la lista
        indiceProductoActual++;
        mostrarProductoActual();
        renderizarListaAcumulada();
    }

    function renderizarListaAcumulada() {
        const contenedor = document.getElementById("contenedorListaAcumulada");
        contenedor.innerHTML = "";
        document.getElementById("cantPendientes").innerText = listaCuadresPendientes.length;

        listaCuadresPendientes.forEach((item, index) => {
            const div = document.createElement("div");
            div.className = "list-item";
            const difText = item.diferencia > 0 ? `+${item.diferencia}` : item.diferencia;
            div.innerHTML = `
                <div>
                    <strong>${item.producto}</strong><br>
                    <span style="color:#666;">Físico: ${item.fisico} | Dif: ${difText}</span>
                </div>
                <button class="btn-danger" onclick="eliminarDeLista(${index})">✕</button>
            `;
            contenedor.appendChild(div);
        });

        document.getElementById("btnEnviarTodo").style.display = listaCuadresPendientes.length > 0 ? "block" : "none";
    }

    function eliminarDeLista(index) {
        listaCuadresPendientes.splice(index, 1);
        renderizarListaAcumulada();
    }

    async function enviarTodosLosCuadres() {
        if (listaCuadresPendientes.length === 0) return;

        const btn = document.getElementById("btnEnviarTodo");
        btn.disabled = true;
        btn.innerText = "Enviando registros...";

        const sucursal = localStorage.getItem("sucursal") || "";
        const empleado = localStorage.getItem("usuario") || "";

        for (let item of listaCuadresPendientes) {
            const formData = new URLSearchParams();
            formData.append("accion", "CuadreInventario");
            formData.append("sucursal", sucursal);
            formData.append("empleado", empleado);
            formData.append("producto", item.producto);
            formData.append("sistema", item.sistema);
            formData.append("fisico", item.fisico);
            formData.append("diferencia", item.diferencia);
            formData.append("observacion", item.observacion);

            try {
                await fetch(URL_API, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: formData
                });
            } catch (err) {
                console.error("Error al registrar:", item.producto, err);
            }
        }

        alert("¡Todos los cuadres han sido guardados exitosamente!");
        listaCuadresPendientes = [];
        btn.disabled = false;
        btn.innerText = "🚀 Registrar Todos los Cuadres";
        renderizarListaAcumulada();
        
        // Reiniciar conteo desde el inicio de la lista
        indiceProductoActual = 1;
        mostrarProductoActual();
    }
</script>
</body>
</html>
