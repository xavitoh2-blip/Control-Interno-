<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Operativo</title>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 450px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    h2, h3 {
      text-align: center;
      margin-top: 0;
      color: var(--primary-dark);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    select, input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background-color: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:active {
      background-color: var(--primary-dark);
    }

    .btn-danger {
      background-color: #ef4444;
      padding: 6px 12px;
      font-size: 0.85rem;
      width: auto;
      float: right;
    }

    .hidden {
      display: none;
    }

    .header-user {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- PANTALLA DE INICIO DE SESIÓN -->
  <div id="sec-login" class="card">
    <h2>Control Operativo</h2>
    <div class="form-group">
      <label>Sucursal:</label>
      <select id="login-sucursal">
        <option value="Tienda Online Shop">Tienda Online Shop</option>
        <option value="Mini Súper Los Bichos">Mini Súper Los Bichos</option>
      </select>
    </div>
    <div class="form-group">
      <label>Empleado:</label>
      <select id="login-empleado">
        <option value="">-- Cargar Empleados --</option>
      </select>
    </div>
    <button onclick="iniciarSesion()">Ingresar</button>
  </div>

  <!-- PANTALLA PRINCIPAL DE OPERACIONES -->
  <div id="sec-app" class="hidden">
    
    <div class="card header-user">
      <div>
        <strong id="user-nombre" style="color: var(--primary-dark);">--</strong><br>
        <small id="user-sucursal" style="color: #64748b;">--</small>
      </div>
      <button class="btn-danger" onclick="cerrarSesion()">Salir</button>
    </div>

    <!-- REGISTRAR ASISTENCIA -->
    <div class="card">
      <h3>📍 Registrar Asistencia</h3>
      <div class="form-group">
        <label>Turno:</label>
        <select id="asist-turno">
          <option value="Apertura">Apertura</option>
          <option value="Cierre">Cierre</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tipo:</label>
        <select id="asist-tipo">
          <option value="Entrada">Entrada</option>
          <option value="Salida">Salida</option>
        </select>
      </div>
      <button onclick="enviarAsistencia()">Guardar Asistencia</button>
    </div>

    <!-- PEDIDOS A BODEGA -->
    <div class="card">
      <h3>🛍️ Solicitud de Productos a Bodega</h3>
      <div class="form-group">
        <label>Buscar Producto:</label>
        <input type="text" id="pedido-producto" list="listaProductos" placeholder="Escribe para buscar..." oninput="filtrarProductosLocales(this.value)">
        <datalist id="listaProductos"></datalist>
      </div>
      <div class="form-group">
        <label>Cantidad Solicitada:</label>
        <input type="number" id="pedido-cantidad" value="1" min="1">
      </div>
      <button style="background-color: #10b981;" onclick="enviarPedido()">Enviar Pedido</button>
    </div>

  </div>

</div>

<script>
  // URL de tu API en Google Apps Script
  const URL_API = "https://script.google.com/macros/s/AKfycbwqZ-RELEVANTE_REEMPLAZAR_AQUI/exec";

  let catalogoLocal = [];
  let usuarioActual = { empleado: "", sucursal: "" };

  // Cargar lista de empleados al abrir la página
  window.onload = async function() {
    try {
      let res = await fetch(`${URL_API}?accion=verEmpleados`);
      let datos = await res.json();
      let select = document.getElementById("login-empleado");
      select.innerHTML = '<option value="">-- Selecciona tu nombre --</option>';
      
      datos.slice(1).forEach(row => {
        if (row[0]) {
          let opt = document.createElement("option");
          opt.value = row[0];
          opt.textContent = row[0];
          select.appendChild(opt);
        }
      });
    } catch (e) {
      console.error("Error al cargar empleados", e);
    }
  };

  async function iniciarSesion() {
    let emp = document.getElementById("login-empleado").value;
    let suc = document.getElementById("login-sucursal").value;

    if (!emp) {
      alert("Por favor selecciona un empleado.");
      return;
    }

    usuarioActual.empleado = emp;
    usuarioActual.sucursal = suc;

    document.getElementById("user-nombre").textContent = emp;
    document.getElementById("user-sucursal").textContent = suc;

    document.getElementById("sec-login").classList.add("hidden");
    document.getElementById("sec-app").classList.remove("hidden");

    // Precargar catálogo en memoria para evitar lag al escribir
    precargarCatalogo();
  }

  function cerrarSesion() {
    document.getElementById("sec-app").classList.add("hidden");
    document.getElementById("sec-login").classList.remove("hidden");
  }

  // Descarga el catálogo una sola vez en memoria
  async function precargarCatalogo() {
    try {
      let res = await fetch(`${URL_API}?accion=verCatalogoProductos`);
      catalogoLocal = await res.json();
    } catch (e) {
      console.error("Error al precargar catálogo", e);
    }
  }

  // Filtra de forma rápida los primeros 10 resultados para no congelar la pantalla
  function filtrarProductosLocales(texto) {
    let datalist = document.getElementById("listaProductos");
    datalist.innerHTML = "";

    if (!texto || texto.trim().length < 2) return;

    let busqueda = texto.toLowerCase();
    let filtrados = catalogoLocal
      .filter(p => String(p).toLowerCase().includes(busqueda))
      .slice(0, 10);

    filtrados.forEach(prod => {
      let opt = document.createElement("option");
      opt.value = prod;
      datalist.appendChild(opt);
    });
  }

  async function enviarAsistencia() {
    let turno = document.getElementById("asist-turno").value;
    let tipo = document.getElementById("asist-tipo").value;

    let params = new URLSearchParams({
      accion: "Asistencia",
      sucursal: usuarioActual.sucursal,
      empleado: usuarioActual.empleado,
      turno: turno,
      tipo: tipo,
      horasExtra: 0
    });

    try {
      await fetch(URL_API, { method: "POST", body: params });
      alert("Asistencia registrada correctamente.");
    } catch (e) {
      alert("Error al guardar asistencia.");
    }
  }

  async function enviarPedido() {
    let prod = document.getElementById("pedido-producto").value;
    let cant = document.getElementById("pedido-cantidad").value;

    if (!prod || !cant) {
      alert("Ingresa un producto y una cantidad válida.");
      return;
    }

    let params = new URLSearchParams({
      accion: "Pedidos",
      sucursal: usuarioActual.sucursal,
      empleado: usuarioActual.empleado,
      producto: prod,
      cantidad: cant
    });

    try {
      await fetch(URL_API, { method: "POST", body: params });
      alert("Pedido enviado a Bodega.");
      document.getElementById("pedido-producto").value = "";
      document.getElementById("pedido-cantidad").value = "1";
    } catch (e) {
      alert("Error al enviar el pedido.");
    }
  }
</script>

</body>
</html>
