<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Online Shop</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); max-width: 450px; margin: 0 auto 20px; text-align: center; }
        h2, h3 { margin-top: 0; color: #2c3e50; }
        label { display: block; text-align: left; font-weight: bold; margin-top: 10px; font-size: 14px; }
        select, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; }
        button { background-color: #27ae60; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #219150; }
        .btn-salida { background-color: #e74c3c; margin-top: 8px; }
        .btn-salida:hover { background-color: #c0392b; }
        .horario-info { color: #e67e22; font-weight: bold; margin: 10px 0; font-size: 14px; }
        .tareas-box { background: #f9f9f9; padding: 12px; border-radius: 8px; border: 1px solid #e0e0e0; margin-top: 15px; max-height: 250px; overflow-y: auto; text-align: left; }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="pantallaLogin" class="card">
        <h2>Ingreso al Sistema</h2>
        
        <label for="selectSucursal">Sucursal:</label>
        <select id="selectSucursal" onchange="filtrarNombresPorSucursal()">
            <option value="">-- Selecciona Sucursal --</option>
            <option value="Mini super">Mini super</option>
            <option value="Tienda Online Shop">Tienda Online Shop</option>
            <option value="Bodega">Bodega</option>
        </select>

        <label for="nombreEmpleado">Colaborador:</label>
        <select id="nombreEmpleado">
            <option value="">-- Selecciona tu nombre --</option>
        </select>

        <button onclick="iniciarSesion()">Ingresar</button>
    </div>

    <!-- PANTALLA PRINCIPAL -->
    <div id="pantallaPrincipal" class="card" style="display: none;">
        <h2 id="saludoUsuario">Bienvenido</h2>
        <div id="infoSucursal" style="font-weight: bold; color: #7f8c8d; margin-bottom: 15px;"></div>

        <label for="selectTurno">Turno de hoy:</label>
        <select id="selectTurno" onchange="cambiarOpcionesTurno()">
            <option value="">-- Selecciona Turno --</option>
            <option value="apertura">Apertura</option>
            <option value="cierre">Cierre</option>
        </select>

        <div id="textoHorario" class="horario-info"></div>

        <!-- LISTA DE TAREAS -->
        <h3>Tareas Asignadas</h3>
        <div id="contenedorTareas" class="tareas-box">
            <p style="font-size: 12px; color: #666;">Selecciona un turno para ver las tareas...</p>
        </div>

        <!-- REGISTRO DE ASISTENCIA -->
        <div id="contenedorBotones" style="display: none; margin-top: 20px;">
            <button id="btnEntrada" onclick="validarYRegistrar('Entrada')">Marcar Entrada</button>
            
            <div id="seccionSalida" style="margin-top: 15px;">
                <label for="selectHorasExtra">Horas Extras al Salir:</label>
                <select id="selectHorasExtra">
                    <option value="0">0 horas</option>
                    <option value="1">1 hora</option>
                    <option value="2">2 horas</option>
                    <option value="3">3 horas</option>
                </select>
                <button class="btn-salida" onclick="validarYRegistrar('Salida')">Marcar Salida</button>
            </div>
        </div>

        <button onclick="cerrarSesion()" style="background-color: #7f8c8d; margin-top: 25px;">Cerrar Sesión</button>
    </div>

    <script>
        const URL_API = "TU_URL_DE_APPS_SCRIPT_AQUI"; // Coloca aquí la Web App URL de Google Apps Script

        // Coordenadas GPS opcionales por sucursal (deja lat/lon en 0 para desactivar GPS)
        const UBICACIONES = {
            "Mini super": { lat: 0, lon: 0 },
            "Tienda Online Shop": { lat: 0, lon: 0 },
            "Bodega": { lat: 0, lon: 0 }
        };
        const RADIO_METROS = 50;

        let listaGlobalNombres = [];
        let tareasGlobales = [];

        window.onload = function() {
            descargarNombresConfig();

            const usuarioGuardado = localStorage.getItem("usuario");
            const sucursalGuardada = localStorage.getItem("sucursal");

            if (usuarioGuardado && sucursalGuardada) {
                document.getElementById("saludoUsuario").innerText = usuarioGuardado;
                document.getElementById("infoSucursal").innerText = "📍 " + sucursalGuardada;
                document.getElementById("pantallaLogin").style.display = "none";
                document.getElementById("pantallaPrincipal").style.display = "block";
                descargarTareasConfig();
            }
        };

        function iniciarSesion() {
            const suc = document.getElementById("selectSucursal").value;
            const emp = document.getElementById("nombreEmpleado").value;

            if (!suc || !emp) return alert("Por favor selecciona tu sucursal y nombre.");

            localStorage.setItem("sucursal", suc);
            localStorage.setItem("usuario", emp);

            document.getElementById("saludoUsuario").innerText = emp;
            document.getElementById("infoSucursal").innerText = "📍 " + suc;
            document.getElementById("pantallaLogin").style.display = "none";
            document.getElementById("pantallaPrincipal").style.display = "block";

            descargarTareasConfig();
        }

        function cerrarSesion() {
            localStorage.clear();
            location.reload();
        }

        function descargarNombresConfig() {
            fetch(URL_API + "?accion=verNombres")
                .then(r => r.json())
                .then(data => {
                    listaGlobalNombres = data.slice(1); // Omite fila 1 (encabezados)
                    filtrarNombresPorSucursal();
                })
                .catch(err => console.error("Error al cargar colaboradores:", err));
        }

        function filtrarNombresPorSucursal() {
            const selectSuc = document.getElementById("selectSucursal");
            const sucursalSeleccionada = selectSuc && selectSuc.value ? selectSuc.value.trim().toLowerCase() : "";
            const selectEmp = document.getElementById("nombreEmpleado");
            
            if (!selectEmp) return;
            selectEmp.innerHTML = '<option value="">-- Selecciona tu nombre --</option>';
            
            if (!sucursalSeleccionada || listaGlobalNombres.length === 0) return;
            
            listaGlobalNombres.forEach(row => {
                let nombre = row[0];                                              // Columna A: colaborador
                let sucursalAsignada = String(row[1] || "").trim().toLowerCase(); // Columna B: sucursal
                
                if (nombre && (sucursalAsignada === sucursalSeleccionada || sucursalAsignada === "todas" || sucursalAsignada === "")) {
                    selectEmp.innerHTML += `<option value="${nombre}">${nombre}</option>`;
                }
            });
        }

        function descargarTareasConfig() {
            fetch(URL_API + "?accion=verTareas")
                .then(r => r.json())
                .then(data => { 
                    tareasGlobales = data; 
                    cambiarOpcionesTurno();
                })
                .catch(() => {
                    const cont = document.getElementById("contenedorTareas");
                    if (cont) cont.innerHTML = "<p style='font-size: 12px; color: red;'>Error al conectar con la configuración de tareas.</p>";
                });
        }

        function cambiarOpcionesTurno() {
            const selectTurno = document.getElementById("selectTurno");
            const turnoSeleccionado = selectTurno && selectTurno.value ? selectTurno.value.trim().toLowerCase() : "";
            const sucursalGuardada = (localStorage.getItem("sucursal") || "").trim().toLowerCase();

            const textoHorario = document.getElementById("textoHorario");
            const contenedorBotones = document.getElementById("contenedorBotones");
            const btnEntrada = document.getElementById("btnEntrada");
            const seccionSalida = document.getElementById("seccionSalida");
            const contenedorTareas = document.getElementById("contenedorTareas");

            if (turnoSeleccionado === "apertura" || turnoSeleccionado === "cierre") {
                if (textoHorario) textoHorario.innerText = turnoSeleccionado === "apertura" ? "Horario: 8:00 am - 5:00 pm" : "Horario: 1:00 pm - 9:00 pm";
                if (contenedorBotones) contenedorBotones.style.display = "block";
                if (btnEntrada) btnEntrada.style.display = "block"; 
                if (seccionSalida) seccionSalida.style.display = "block";
            } else {
                if (textoHorario) textoHorario.innerText = "";
                if (contenedorBotones) contenedorBotones.style.display = "none";
                if (contenedorTareas) contenedorTareas.innerHTML = "<p style='font-size: 12px; color: #666;'>Selecciona un turno para ver las tareas...</p>";
                return;
            }

            if (!tareasGlobales || tareasGlobales.length === 0) {
                if (contenedorTareas) contenedorTareas.innerHTML = "<p style='font-size: 12px; color: #666;'>Cargando tareas...</p>";
                return;
            }

            let html = "";
            let encontradas = 0;

            for (let i = 1; i < tareasGlobales.length; i++) {
                let fila = tareasGlobales[i];
                if (!fila || fila.length < 5) continue;

                let turnoFila = String(fila[1] || "").trim().toLowerCase();    // Columna B: Turno
                let areaFila = fila[3] || "";                                 // Columna D: area
                let tareaDesc = fila[4];                                      // Columna E: Descripcion_Tarea
                let sucursalFila = String(fila[5] || "").trim().toLowerCase(); // Columna F: sucursal

                let coincideTurno = (turnoFila === turnoSeleccionado || turnoFila === "ambos" || turnoFila === "todos");
                let coincideSucursal = (sucursalFila === sucursalGuardada || sucursalFila === "todas" || sucursalFila === "");

                if (coincideTurno && coincideSucursal && tareaDesc) {
                    encontradas++;
                    let textoMostrar = areaFila ? `<b>[${areaFila}]</b> ${tareaDesc}` : tareaDesc;
                    let isChecked = localStorage.getItem("tarea_" + tareaDesc) === "true" ? "checked" : "";

                    html += `<label style="font-size: 13px; display: block; margin: 8px 0; text-align: left; font-weight: normal;">
                                <input type="checkbox" ${isChecked} onclick="guardarTarea('${tareaDesc}', this)"> ${textoMostrar}
                             </label>`;
                }
            }

            if (contenedorTareas) {
                contenedorTareas.innerHTML = encontradas > 0 
                    ? html 
                    : "<p style='font-size: 12px; color: #666;'>No hay tareas configuradas para este turno y sucursal.</p>";
            }
        }

        function validarYRegistrar(tipo) {
            const turnoSelect = document.getElementById("selectTurno");
            const turno = turnoSelect ? turnoSelect.value : "";
            if (!turno) return alert("Selecciona un turno.");

            const sucursalActual = localStorage.getItem("sucursal");
            const coordenadasLocal = UBICACIONES[sucursalActual];

            if (coordenadasLocal && coordenadasLocal.lat !== 0 && coordenadasLocal.lon !== 0) {
                if (!navigator.geolocation) return alert("Tu navegador no soporta geolocalización.");

                navigator.geolocation.getCurrentPosition(pos => {
                    const dist = calcularDistancia(coordenadasLocal.lat, coordenadasLocal.lon, pos.coords.latitude, pos.coords.longitude);
                    if (dist <= RADIO_METROS) {
                        enviarRegistroAsistencia(tipo, turno, sucursalActual);
                    } else {
                        alert(`❌ Estás muy lejos del local (${Math.round(dist)}m). Acércate para marcar.`);
                    }
                }, () => alert("Debes permitir el acceso a tu ubicación para marcar asistencia."), { enableHighAccuracy: true });
            } else {
                enviarRegistroAsistencia(tipo, turno, sucursalActual);
            }
        }

        function enviarRegistroAsistencia(tipo, turno, sucursalActual) {
            let horasExtra = "0";
            if (tipo === "Salida") {
                const extraSelect = document.getElementById("selectHorasExtra");
                horasExtra = extraSelect ? extraSelect.value || "0" : "0";
            }

            const ahora = new Date();
            const fechaActual = ahora.toLocaleDateString("es-SV");
            const horaActual = ahora.toLocaleTimeString("es-SV", { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            const params = new URLSearchParams({
                accion: "Asistencia",
                fecha: fechaActual,
                hora: horaActual,
                sucursal: sucursalActual, 
                turno: turno, 
                tipo: tipo, 
                empleado: localStorage.getItem("usuario") || "",
                horasExtra: horasExtra
            });

            fetch(URL_API, { method: "POST", body: params })
                .then(() => alert(`¡Asistencia de ${tipo} registrada con éxito!`))
                .catch(err => console.error("Error al registrar asistencia:", err));
        }

        function guardarTarea(descripcion, checkbox) {
            localStorage.setItem("tarea_" + descripcion, checkbox.checked);
            
            if (checkbox.checked) {
                const params = new URLSearchParams({
                    accion: "Tareas",
                    idTarea: "T_" + Date.now(),
                    empleado: localStorage.getItem("usuario") || "",
                    descripcion: descripcion,
                    estado: "Completado",
                    fechaCompletado: new Date().toLocaleString("es-SV")
                });

                fetch(URL_API, { method: "POST", body: params })
                    .catch(err => console.error("Error al registrar tarea completada:", err));
            }
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c;
        }
    </script>
</body>
</html>
