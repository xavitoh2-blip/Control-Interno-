<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Operativo</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; margin: 20px auto; width: 320px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; margin: 5px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
        select, input { padding: 8px; margin: 5px; width: 85%; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
    </style>
</head>
<body>

    <h1>Control de Asistencia y Pedidos</h1>

    <!-- Sección de Asistencia con Lista Desplegable -->
    <div class="card">
        <h3>Registrar Asistencia</h3>
        <select id="nombreEmpleado">
            <option value="">-- Selecciona tu nombre --</option>
            <option value="ANA RUTH">ANA RUTH</option>
            <option value="ROSA">ROSA</option>
            <option value="DARLYN">DARLYN</option>
            <option value="JOSELIN">JOSELIN</option>
            <option value="PAOLA">PAOLA</option>
            <option value="BRENDALI">BRENDALI</option>
        </select>
        <br>
        <button onclick="registrarAsistencia('Entrada')">Entrada</button>
        <button onclick="registrarAsistencia('Salida')">Salida</button>
    </div>

    <!-- Sección de Pedidos -->
    <div class="card">
        <h3>Hacer Pedido</h3>
        <select id="empleadoPedido">
            <option value="">-- Selecciona tu nombre --</option>
            <option value="ANA RUTH">ANA RUTH</option>
            <option value="ROSA">ROSA</option>
            <option value="DARLYN">DARLYN</option>
            <option value="JOSELIN">JOSELIN</option>
            <option value="PAOLA">PAOLA</option>
            <option value="BRENDALI">BRENDALI</option>
        </select>
        <br>
        <input type="text" id="productoPedido" placeholder="Producto">
        <br>
        <input type="number" id="cantidadPedido" placeholder="Cantidad" value="1">
        <br>
        <button onclick="enviarPedido()">Enviar Pedido</button>
    </div>

    <script>
        const URL_API = "https://script.google.com/macros/s/AKfycbyGkLeBaw3Qb6PO_3fFHPgYKw9bGoZocPainbHE7eT3pIcRpZ2i2Jsc_SEUX7fIbKeZ/exec";

        function registrarAsistencia(tipo) {
            const empleado = document.getElementById("nombreEmpleado").value;
            if (!empleado) {
                alert("Por favor selecciona un nombre de la lista.");
                return;
            }

            const params = new URLSearchParams();
            params.append("accion", "Asistencia");
            params.append("tipo", tipo);
            params.append("empleado", empleado);

            fetch(URL_API, { method: "POST", body: params })
            .then(res => res.text())
            .then(data => {
                alert("¡Asistencia de " + tipo + " registrada para " + empleado + "!");
                document.getElementById("nombreEmpleado").value = "";
            })
            .catch(err => {
                console.error("Error:", err);
                alert("Hubo un error al registrar.");
            });
        }

        function enviarPedido() {
            const empleado = document.getElementById("empleadoPedido").value;
            const producto = document.getElementById("productoPedido").value.trim();
            const cantidad = document.getElementById("cantidadPedido").value.trim();

            if (!empleado || !producto || !cantidad) {
                alert("Por favor completa todos los campos del pedido.");
                return;
            }

            const params = new URLSearchParams();
            params.append("accion", "Pedidos");
            params.append("empleado", empleado);
            params.append("producto", producto);
            params.append("cantidad", cantidad);

            fetch(URL_API, { method: "POST", body: params })
            .then(res => res.text())
            .then(data => {
                alert("¡Pedido enviado correctamente!");
                document.getElementById("productoPedido").value = "";
                document.getElementById("cantidadPedido").value = "1";
            })
            .catch(err => {
                console.error("Error:", err);
                alert("Hubo un error al enviar el pedido.");
            });
        }
    </script>

</body>
</html>
