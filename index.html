<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Operativo - Online Shop</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f4f4f9; color: #333; }
        
        /* Cabecera de bienvenida */
        .welcome-header { background: #ffffff; padding: 20px; border-radius: 12px; max-width: 350px; margin: 20px auto; box-shadow: 0px 4px 10px rgba(0,0,0,0.05); }
        .welcome-header h1 { margin: 0 0 5px 0; color: #f39c12; font-size: 22px; }
        .welcome-header p { margin: 0; color: #666; font-size: 14px; }

        .card { background: white; padding: 20px; margin: 15px auto; width: 320px; border-radius: 12px; box-shadow: 0px 4px 12px rgba(0,0,0,0.1); }
        h3 { color: #333; margin-top: 0; font-size: 17px; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; margin: 5px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; }
        button:hover { filter: brightness(90%); }
        select, input { padding: 10px; margin: 8px 0; width: 90%; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; outline: none; }
        
        #supervisorSection { display: none; margin-top: 30px; padding: 20px; background: #fff; border-radius: 12px; max-width: 650px; margin-left: auto; margin-right: auto; box-shadow: 0px 4px 12px rgba(0,0,0,0.1); text-align: left; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f8f9fa; }
        .login-box { margin: 30px auto; padding: 20px; background: white; width: 300px; border-radius: 10px; box-shadow: 0px 2px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- Encabezado de Inicio / Bienvenida -->
    <div class="welcome-header">
        <h1>Online Shop</h1>
        <p>Control Operativo de Personal</p>
    </div>

    <!-- Sección de Asistencia -->
    <div class="card">
        <h3>⏰ Registrar Asistencia</h3>
        <select id="nombreEmpleado"><option value="">Cargando nombres...</option></select>
        <br>
        <button onclick="registrarAsistencia('Entrada')" style="background-color: #28a745;">Entrada</button>
        <button onclick="registrarAsistencia('Salida')" style="background-color: #dc3545;">Salida</button>
    </div>

    <!-- Sección de Pedidos -->
    <div class="card">
        <h3>🛒 Hacer Pedido</h3>
        <select id="empleadoPedido"><option value="">Cargando nombres...</option></select>
        <br>
        <input type="text" id="productoPedido" placeholder="Nombre del producto">
        <br>
        <input type="number" id="cantidadPedido" placeholder="Cantidad" value="1">
        <br>
        <button onclick="enviarPedido()" style="background-color: #007bff;">Enviar Pedido</button>
    </div>

    <!-- Botón de Acceso a Supervisor -->
    <div style="margin: 30px 0;">
        <button onclick="mostrarLogin()" style="background-color: #6c757d; font-size: 13px; padding: 8px 14px;">🔒 Panel de Supervisor</button>
    </div>

    <!-- Modal de Contraseña -->
    <div id="loginModal" class="login-box" style="display:none;">
        <h3>Clave de Supervisor</h3>
        <input type="password" id="adminPassword" placeholder="Contraseña">
        <br>
        <button onclick="verificarPassword()" style="background-color: #007bff;">Ingresar</button>
        <button onclick="ocultarLogin()" style="background-color: #6c757d;">Cancelar</button>
    </div>

    <!-- Panel de Historial (Oculto) -->
    <div id="supervisorSection">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; color: #007bff;">Historial General</h3>
            <button onclick="cerrarSupervisor()" style="background-color: #dc3545; padding: 5px 10px; font-size: 12px;">Cerrar</button>
        </div>
        
        <h4>Asistencias</h4>
        <div style="overflow-x: auto; max-height: 200px;"><table id="tablaAsistencia"><tr><th>Fecha</th><th>Hora</th><th>Tipo</th><th>Empleado</th></tr></table></div>

        <h4>Pedidos</h4>
        <div style="overflow-x: auto; max-height: 200px;"><table id="tablaPedidos"><tr><th>Fecha</th><th>Hora</th><th>Empleado</th><th>Producto</th><th>Cant.</th><th>Estado</th></tr></table></div>
    </div>

    <script>
        const URL_API = "https://script.google.com/macros/s/AKfycbzcX-rubmNtQ99Fyhu_3x3C7Q1gBaWxcZ84YtQRhKstvXuH35kQnvQVa1Y99izWckB3/exec";

        window.onload = function() {
            fetch(URL_API)
                .then(res => res.json())
                .then(data => {
                    const selA = document.getElementById("nombreEmpleado");
                    const selP = document.getElementById("empleadoPedido");
                    selA.innerHTML = '<option value="">-- Selecciona tu nombre --</option>';
                    selP.innerHTML = '<option value="">-- Selecciona tu nombre --</option>';
                    data.forEach(n => { if(n[0] && n[0].trim() !== "") { selA.innerHTML += `<option value="${n[0]}">${n[0]}</option>`; selP.innerHTML += `<option value="${n[0]}">${n[0]}</option>`; } });
                });
        };

        function registrarAsistencia(tipo) {
            const emp = document.getElementById("nombreEmpleado").value;
            if (!emp) return alert("Por favor selecciona tu nombre.");
            const params = new URLSearchParams({accion: "Asistencia", tipo: tipo, empleado: emp});
            fetch(URL_API, { method: "POST", body: params }).then(() => { alert("¡Asistencia de " + tipo + " registrada con éxito!"); document.getElementById("nombreEmpleado").value = ""; });
        }

        function enviarPedido() {
            const emp = document.getElementById("empleadoPedido").value;
            const prod = document.getElementById("productoPedido").value.trim();
            const cant = document.getElementById("cantidadPedido").value.trim();
            if (!emp || !prod || !cant) return alert("Por favor completa todos los campos.");
            const params = new URLSearchParams({accion: "Pedidos", empleado: emp, producto: prod, cantidad: cant});
            fetch(URL_API, { method: "POST", body: params }).then(() => { alert("¡Pedido enviado correctamente!"); document.getElementById("productoPedido").value = ""; document.getElementById("cantidadPedido").value = "1"; });
        }

        function mostrarLogin() { document.getElementById("loginModal").style.display = "block"; }
        function ocultarLogin() { document.getElementById("loginModal").style.display = "none"; document.getElementById("adminPassword").value = ""; }
        
        function verificarPassword() {
            if (document.getElementById("adminPassword").value === "1234") { 
                ocultarLogin(); document.getElementById("supervisorSection").style.display = "block"; cargarHistorial();
            } else { alert("Contraseña incorrecta"); }
        }

        function cerrarSupervisor() { document.getElementById("supervisorSection").style.display = "none"; }

        function cargarHistorial() {
            fetch(URL_API + "?accion=verAsistencia").then(r => r.json()).then(data => {
                let html = "<tr><th>Fecha</th><th>Hora</th><th>Tipo</th><th>Empleado</th></tr>";
                for(let i = 1; i < data.length; i++) html += `<tr><td>${data[i][0]}</td><td>${data[i][1]}</td><td>${data[i][2]}</td><td>${data[i][3]}</td></tr>`;
                document.getElementById("tablaAsistencia").innerHTML = html;
            });
            fetch(URL_API + "?accion=verPedidos").then(r => r.json()).then(data => {
                let html = "<tr><th>Fecha</th><th>Hora</th><th>Empleado</th><th>Producto</th><th>Cant.</th><th>Estado</th></tr>";
                for(let i = 1; i < data.length; i++) html += `<tr><td>${data[i][0]}</td><td>${data[i][1]}</td><td>${data[i][2]}</td><td>${data[i][3]}</td><td>${data[i][4]}</td><td>${data[i][5]}</td></tr>`;
                document.getElementById("tablaPedidos").innerHTML = html;
            });
        }
    </script>
</body>
</html>
